[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veyra"
version = "0.1.0"
description = "Production-oriented fraud detection data foundations"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "duckdb>=1.1,<2",
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.6,<2",
    "lightgbm>=4.6,<5",
    "joblib>=1.4,<2",
    "threadpoolctl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veyra = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
